name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to v<kg.version> from android/gradle.properties)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key (if configured)
        env:
          SIGNING_JKS_BASE64: ${{ secrets.SIGNING_JKS_BASE64 }}
        run: |
          if [ -n "$SIGNING_JKS_BASE64" ]; then
            echo "$SIGNING_JKS_BASE64" | base64 -d > android/app/signing.jks
            echo "HAS_SIGNING_KEY=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SIGNING_KEY=false" >> "$GITHUB_ENV"
          fi
      - name: Build APKs
        working-directory: android
        run: |
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            ./gradlew --no-daemon assembleKidRelease assembleHomeRelease :parent:assembleRelease
          else
            ./gradlew --no-daemon assembleKidDebug assembleHomeDebug :parent:assembleDebug
          fi
      - name: Package release assets
        run: |
          mkdir -p build
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            cp android/app/build/outputs/apk/kid/release/app-kid-release.apk build/kidguard.apk
            cp android/app/build/outputs/apk/home/release/app-home-release.apk build/kidguard-home.apk
            cp android/parent/build/outputs/apk/release/parent-release.apk build/kidguard-parent.apk
          else
            cp android/app/build/outputs/apk/kid/debug/app-kid-debug.apk build/kidguard.apk
            cp android/app/build/outputs/apk/home/debug/app-home-debug.apk build/kidguard-home.apk
            cp android/parent/build/outputs/apk/debug/parent-debug.apk build/kidguard-parent.apk
          fi
          V=$(sed -n 's/^kg\.version=//p' android/gradle.properties)
          C=$(sed -n 's/^kg\.code=//p' android/gradle.properties)
          sha() { sha256sum "build/$1" | cut -d' ' -f1; }
          printf '{"version": "%s", "code": %s, "files": {"kidguard.apk": "%s", "kidguard-home.apk": "%s", "kidguard-parent.apk": "%s"}}\n' \
            "$V" "$C" "$(sha kidguard.apk)" "$(sha kidguard-home.apk)" "$(sha kidguard-parent.apk)" > build/version.json
          (cd build && for f in kidguard.apk kidguard-home.apk kidguard-parent.apk; do sha256sum "$f" > "$f.sha256"; done)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          V=$(sed -n 's/^kg\.version=//p' android/gradle.properties)
          TAG="${GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG:-v$V}"
          fi
          ASSETS=(
            build/kidguard.apk
            build/kidguard-home.apk
            build/kidguard-parent.apk
            build/version.json
            build/kidguard.apk.sha256
            build/kidguard-home.apk.sha256
            build/kidguard-parent.apk.sha256
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$TAG" --notes-file scripts/release-files.md
          fi
